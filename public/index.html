<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TECH SHUTTER HUB | 3D Immersive Portfolio &amp; Cinematography Gallery</title>
  <meta name="description" content="Explore Tech Shutter Hub's work in an immersive 3D gallery: 8K cinematography, camera &amp; lens reviews, drone aerials, commercial brand films, and studio photography." />
  
  <!-- Favicon -->
  <link rel="icon" href="/favicon.png" type="image/png" />
  
  <!-- Open Graph -->
  <meta property="og:title" content="TECH SHUTTER HUB | 3D Immersive Portfolio" />
  <meta property="og:description" content="Experience cutting-edge cinematography, camera reviews, and visual productions in our 3D interactive gallery." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/logos/logo-dark-bg.jpg" />

  <!-- Core Theme & Styles -->
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Floating Navigation Bar -->
  <header class="tsh-nav" role="banner">
    <div class="tsh-nav-left">
      <a href="/" class="brand-badge" title="Tech Shutter Hub Home">
        <img class="brand-logo-img" src="/assets/logos/logo-dark-transparent.png" alt="Tech Shutter Hub Logo" />
        <div class="brand-text">
          <span class="brand-name">Tech Shutter Hub</span>
          <span class="brand-sub">Visual Productions</span>
        </div>
      </a>
    </div>

    <div class="tsh-nav-right">
      <!-- Search button -->
      <button class="nav-btn btn-icon-only" id="searchBtn" title="Search Projects (Press /)" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <!-- Audio Mute/Unmute -->
      <button class="nav-btn btn-icon-only" id="soundToggleBtn" title="Sound Effects" aria-label="Sound Effects">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>

      <!-- Theme Switcher (Dark / Light) -->
      <button class="nav-btn theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
        <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span class="lbl theme-text">Light</span>
      </button>

      <!-- Grid View Switch -->
      <a href="/gallery.html" class="nav-btn" title="Switch to Grid View" aria-label="Grid View">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
        <span class="lbl">Grid View</span>
      </a>

      <!-- Start Project CTA -->
      <button class="nav-btn btn-cta open-inquire-btn" title="Start a Project">
        <span>Start a Project</span>
      </button>
    </div>
  </header>

  <!-- Category Filter Pill Bar -->
  <div class="cats-container">
    <nav class="cats" id="cats" role="navigation" aria-label="Project Categories"></nav>
  </div>

  <!-- Full-Screen 3D WebGL Canvas Container -->
  <main id="app" aria-label="3D Immersive Cylinder Room"></main>

  <!-- Centered Hero Headline (Auto-Fades on user interaction) -->
  <div class="headline" aria-hidden="true">
    <div class="eyebrow">Visual Stories by</div>
    <div class="brand">TECH SHUTTER HUB</div>
    <div class="tagline">
      <span></span>
      Cinematography &middot; Gear &middot; Visual Arts &middot; Drag to explore
      <span></span>
    </div>
  </div>

  <!-- Floating Dynamic 3D Tilted Label Tag (Calculated by Raycaster) -->
  <div class="tip" id="tip" role="tooltip" aria-hidden="true"></div>

  <!-- Bottom Interaction Hint Bar -->
  <footer class="hint" role="contentinfo">
    <span>Drag to spin</span> &middot;
    <span>Pinch / Scroll to zoom</span> &middot;
    <span>Click tile to open</span> &middot;
    <span>Press <b>/</b> to search</span>
  </footer>

  <!-- Cinematic Video & Photo Lightbox Modal -->
  <div class="vbox" id="vbox" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="vbox-close" id="vboxClose" aria-label="Close Lightbox">&times;</button>
    <div class="vbox-stage">
      <div class="vbox-frame">
        <div class="vbox-embed" id="vboxEmbed"></div>
        <img class="vbox-img" id="vboxImg" alt="Project Media" hidden />
        <button class="vbox-nav prev" id="vboxPrev" aria-label="Previous Photo" hidden>&#8249;</button>
        <button class="vbox-nav next" id="vboxNext" aria-label="Next Photo" hidden>&#8250;</button>
        <div class="vbox-count" id="vboxCount" hidden></div>
      </div>
      <div class="vbox-bar">
        <div>
          <h2 class="vbox-title" id="vboxTitle"></h2>
          <span class="vbox-cat" id="vboxCat"></span>
        </div>
        <button class="vbox-cta" id="vboxCta">Book a Shoot &rarr;</button>
      </div>
    </div>
  </div>

  <!-- Project Inquiry / Booking Modal -->
  <div class="modal-overlay" id="inquireModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <button class="modal-close" id="inquireClose" aria-label="Close Modal">&times;</button>
      <div class="modal-header">
        <h3>Start Your Project</h3>
        <p>Let's craft your next visual story with cinematic quality.</p>
      </div>
      <form id="inquireForm">
        <div class="form-row">
          <div class="form-group">
            <label for="clientName">Your Name *</label>
            <input type="text" id="clientName" class="form-control" placeholder="e.g. Alexander Vance" required />
          </div>
          <div class="form-group">
            <label for="clientEmail">Email Address *</label>
            <input type="email" id="clientEmail" class="form-control" placeholder="alex@studio.com" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="clientPhone">Phone / WhatsApp</label>
            <input type="tel" id="clientPhone" class="form-control" placeholder="+1 (555) 019-2834" />
          </div>
          <div class="form-group">
            <label for="projectType">Service / Production Type *</label>
            <select id="projectType" class="form-control" required>
              <option value="Cinematography">Cinematography &amp; Film Production</option>
              <option value="Tech & Gear Reviews">Tech &amp; Camera Gear Review</option>
              <option value="Drone & Aerial">Drone &amp; Aerial Filming</option>
              <option value="Product Shoots">Luxury Product Shoot</option>
              <option value="Brand Commercials">Commercial &amp; Brand Story</option>
              <option value="Studio & Portraits">Studio &amp; Editorial Portraits</option>
              <option value="Weddings & Films">Weddings &amp; Feature Films</option>
              <option value="Events & Live">Events &amp; Live Music</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="projectDate">Estimated Date / Timeline</label>
            <input type="date" id="projectDate" class="form-control" />
          </div>
          <div class="form-group">
            <label for="projectBudget">Budget Range</label>
            <select id="projectBudget" class="form-control">
              <option value="$1k - $3k">$1,000 - $3,000</option>
              <option value="$3k - $8k" selected>$3,000 - $8,000</option>
              <option value="$8k - $20k">$8,000 - $20,000</option>
              <option value="$20k+">$20,000+</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="projectMessage">Project Vision &amp; Details</label>
          <textarea id="projectMessage" class="form-control" placeholder="Tell us about the project goals, locations, or reference styles..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Inquiry &rarr;</button>
        <div class="form-status" id="formStatus"></div>
      </form>
    </div>
  </div>

  <!-- Search & Command Palette Modal -->
  <div class="search-palette" id="searchPalette" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search by title, gear, camera or category... (Esc to close)" autocomplete="off" />
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <!-- Core Scripts -->
  <script src="/js/theme.js"></script>
  <script src="/js/audio.js"></script>
  <script type="module" src="/js/app3d.js"></script>
  <script src="/js/lightbox.js"></script>
  <script src="/js/inquire.js"></script>
</body>
</html>
